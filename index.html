<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Animated Kenya Map Canvas</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        background: #1a1a1a;
        color: white;
      }
      canvas {
        border: 1px solid #333;
        background: #222;
      }
    </style>
  </head>
  <body>
    <canvas id="mapCanvas" width="500" height="500"></canvas>

    <script>
      const canvas = document.getElementById("mapCanvas");
      const ctx = canvas.getContext("2d");

      // Approximate coordinate outline for a simplified map of Kenya
      const kenyaOutline = [
        { x: 200, y: 100 },
        { x: 290, y: 110 },
        { x: 320, y: 160 },
        { x: 380, y: 260 },
        { x: 330, y: 390 },
        { x: 310, y: 410 },
        { x: 240, y: 370 },
        { x: 180, y: 320 },
        { x: 150, y: 280 },
        { x: 150, y: 200 },
        { x: 170, y: 150 },
      ];

      let pulseAngle = 0;

      function drawMap() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Draw Kenya Border
        ctx.beginPath();
        ctx.moveTo(kenyaOutline[0].x, kenyaOutline[0].y);
        for (let i = 1; i < kenyaOutline.length; i++) {
          ctx.lineTo(kenyaOutline[i].x, kenyaOutline[i].y);
        }
        ctx.closePath();
        ctx.strokeStyle = "#00ffd5";
        ctx.lineWidth = 3;
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#00ffd5";
        ctx.stroke();
        ctx.shadowBlur = 0; // Reset shadow

        // 2. Draw Animate Pulsating Marker (e.g., Nairobi)
        pulseAngle += 0.05;
        let pulseRadius = 6 + Math.sin(pulseAngle) * 3;

        ctx.beginPath();
        ctx.arc(240, 310, pulseRadius, 0, Math.PI * 2);
        ctx.fillStyle = "#ff0055";
        ctx.fill();

        requestAnimationFrame(drawMap);
      }

      drawMap();
    </script>
  </body>
</html>
